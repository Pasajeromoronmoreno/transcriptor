[input]
push_start_threshold_ms = 300
tap_timeout_ms = 250
push_release_window_ms = 150
# Multiplicador digital del volumen (por defecto 1.0)
audio_multiplier = 14.0
# Dispositivo de captura para parec. Vacío o ausente usa la fuente por defecto
# del sistema. Sirve para mandar el dictado a una fuente ya procesada —por
# ejemplo la de EasyEffects— sin cambiar la fuente por defecto de todo el
# sistema, que afectaría también a videollamadas.
# Listar las disponibles con: pactl list short sources
# device = "easyeffects_source"

# Audio anterior al atajo que se antepone al dictado, en milisegundos.
#
# El micrófono está caliente de forma permanente, pero mientras no se graba
# cada bloque se descarta. Quien empieza a hablar y aprieta la tecla una
# fracción tarde pierde la primera sílaba; esta ventana la recupera.
#
# No aporta nada si se aprieta primero y se habla después: en ese caso el
# pre-roll sólo contiene silencio, y la puerta de ruido lo descarta igual.
# Cero lo desactiva.
preroll_ms = 300

# Puerta de ruido: descarta el audio que queda por debajo del umbral, para que
# el ruido de fondo de las pausas no llegue a la transcripción.
#
# No separa el fondo de la voz cuando suenan a la vez: eso viaja en las mismas
# muestras y ningún umbral lo resuelve. Lo que sí elimina es el fondo constante
# de los silencios, que es lo que ensucia el resultado.
#
# Viene apagada porque los umbrales dependen del micrófono y del ambiente; un
# valor genérico cortaría la voz en unos equipos y no filtraría nada en otros.
#
# Para calibrarla, medir el RMS en dBFS del fondo y de la voz por separado. El
# umbral de apertura va entre ambos; el de cierre, unos dB por debajo del de
# apertura pero POR ENCIMA del nivel del fondo.
#
# Ese último punto es el que se pasa por alto: si el cierre queda pegado al
# nivel del fondo, la puerta abre una vez y ya no vuelve a cerrar, y parece que
# no filtrara nada. Conviene dejarle 3 o 4 dB de aire.
#
# Si deja pasar ruido de fondo -> subir ambos umbrales.
# Si corta sílabas o se come palabras -> bajar el de apertura.
#
# Los cambios se leen al arrancar: hay que reiniciar la aplicación.
[gate]
enabled = false
# Nivel a partir del cual se empieza a grabar, en dBFS.
open_threshold_dbfs = -27.0
# Nivel por debajo del cual se corta. Más bajo que el de apertura para que la
# puerta no castañetee en el borde del umbral.
close_threshold_dbfs = -31.0
# Cuánto se sostiene abierta tras caer por debajo, para no comerse las pausas
# entre palabras.
release_ms = 250

[logging]
# Nivel por defecto; RUST_LOG lo puede sobrescribir temporalmente.
level = "info"
# Escribir además un archivo JSON diario en el estado de usuario.
file = true
# Días de retención de archivos de log rotados.
retention_days = 7

[retry]
max_attempts = 3
initial_delay_ms = 1000
max_delay_ms = 5000
jitter_ms = 250

[groq]
# Recomendado: guarda la API key en .env como GROQ_API_KEY.
# Este campo queda como fallback local, pero puede quedar vacio.
api_key = ""
language = "es"
# Prompt para guiar el estilo de Whisper (puntuación y formato correcto)
whisper_prompt = "Esta es una transcripción en español con puntuación gramatical correcta. Incluye comas, puntos y signos de interrogación para marcar las pausas y el sentido de la conversación."
experimental_live = true
connect_timeout_ms = 5000
request_timeout_ms = 30000

[output]
# Copiar la transcripción final al portapapeles
copy_to_clipboard = true
# Pegar directamente en el input box activo (vía teclado virtual)
paste_to_input = true
# Simular Enter al final del pegado (útil para chatbots)
auto_enter = true
# Tiempo de espera (en ms) antes de mandar el Enter para dar tiempo al portapapeles
auto_enter_delay_ms = 10
# Asegurar punto final (.)
add_period = true
# Exportar la última grabación a audio_exports/last_capture.wav (para debugging/experimentos)
export_audio = false

[pipeline]
# "robust" = graba todo, transcribe al final (recomendado)
# "realtime" = chunking en vivo, experimental
mode = "robust"
# Solo para realtime: ventana de chunk en ms
chunk_window_ms = 800
# Habilitar perfilado de latencia paso a paso en consola
profile_latency = false

[hotkeys]
# Tecla modificadora principal.
modifier = "KEY_LEFTCTRL"
# Tecla para iniciar/frenar (combinada con el modificador anterior).
trigger = "KEY_GRAVE"
# Tecla para togglear punto/espacio durante la grabación.
toggle_format = "KEY_LEFTALT"
# Tecla para stop e INVERTIR el comportamiento de Enter.
send_with_enter = "KEY_SPACE"
# Teclas (junto al modificador principal) para subir y bajar ganancia de micrófono.
increase_gain = "KEY_UP"
decrease_gain = "KEY_DOWN"

[dictionary]
# Activar o desactivar por completo el diccionario de reemplazos para comparar performance/lag
enabled = true

# Diccionario de reemplazos post-transcripción (case-insensitive).
# Formato: "palabra_mal_transcrita" = "reemplazo_correcto"
# Podés agregar tantas como quieras.
# aupe = "AUP"
# gpt cuatro = "GPT-4"
